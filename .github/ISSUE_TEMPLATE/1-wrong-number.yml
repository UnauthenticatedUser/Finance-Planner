name: Wrong number or something broken
description: A calculation looks wrong, something doesn't work, or a text is wrong or missing.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. You can write in English or Estonian.

        **Issues are public.** Please don't paste your real numbers, screenshots showing your own data, or your backup file. Use made-up numbers that show the problem.
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown at the bottom right of the page.
      placeholder: v1.5.2
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where do you use it?
      options:
        - Online (unauthenticateduser.github.io)
        - Downloaded file
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Firefox on a laptop, Safari on an iPhone
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: Which card or field, and what it showed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: For a number, what it should be and how you got it (for example, the Tax and Customs Board's calculator or your payslip, with made-up amounts).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to see it
      description: The made-up numbers to enter, step by step.
      placeholder: |
        1. Gross salary €2,500
        2. 3rd pillar €300 a month
        3. The Pensions card shows …
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue contains none of my real financial data and no backup file.
          required: true
